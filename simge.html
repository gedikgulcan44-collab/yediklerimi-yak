<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Simge Üretici - Yediklerimi Yak</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #fff3e0; color: #333; }
        .box { background: white; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        canvas { border: 1px solid #ccc; margin: 10px; border-radius: 12px; background: #ff7043; }
        button { background: #ff7043; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin: 5px; font-weight: bold; }
        button:hover { background: #f4511e; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🍟 Simge Üretici</h1>
        <p>Aşağıdaki düğmeleri kullanarak simgeleri bilgisayarınıza indirin ve GitHub'a yükleyin.</p>
        
        <div>
            <h3>192x192 Simge</h3>
            <canvas id="canvas192" width="192" height="192"></canvas>
            <br>
            <button onclick="downloadCanvas('canvas192', 'icon-192.png')">icon-192.png İndir</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <div>
            <h3>512x512 Simge</h3>
            <canvas id="canvas512" width="512" height="512"></canvas>
            <br>
            <button onclick="downloadCanvas('canvas512', 'icon-512.png')">icon-512.png İndir</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <div>
            <h3>Apple Touch Icon (180x180)</h3>
            <canvas id="canvasApple" width="180" height="180"></canvas>
            <br>
            <button onclick="downloadCanvas('canvasApple', 'apple-touch-icon.png')">apple-touch-icon.png İndir</button>
        </div>
    </div>

    <script>
        function drawIcon(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const size = canvas.width;

            ctx.fillStyle = '#ff7043';
            ctx.fillRect(0, 0, size, size);

            ctx.font = `${size * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍟', size / 2, size / 2);
        }

        drawIcon('canvas192');
        drawIcon('canvas512');
        drawIcon('canvasApple');

        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
